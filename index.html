<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Relative Light Cone Simulation — Interaction-Induced Branching</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0a0f;
            color: #e0e0e0;
            font-family: 'Segoe UI', system-ui, sans-serif;
            overflow: hidden;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        header {
            padding: 10px 20px;
            background: #111118;
            border-bottom: 1px solid #2a2a3a;
            display: flex;
            align-items: center;
            gap: 20px;
            flex-wrap: wrap;
        }
        header h1 {
            font-size: 14px;
            font-weight: 600;
            color: #8ab4f8;
            white-space: nowrap;
        }
        .controls {
            display: flex;
            gap: 12px;
            align-items: center;
            flex-wrap: wrap;
        }
        .control-group {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .control-group label {
            font-size: 11px;
            color: #888;
            white-space: nowrap;
        }
        .control-group input[type="range"] {
            width: 80px;
            accent-color: #8ab4f8;
        }
        .control-group span {
            font-size: 11px;
            color: #aaa;
            min-width: 28px;
        }
        button {
            background: #2a2a3a;
            border: 1px solid #3a3a4a;
            color: #e0e0e0;
            padding: 4px 12px;
            border-radius: 4px;
            font-size: 11px;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover { background: #3a3a5a; }
        button.active { background: #4a4a6a; border-color: #8ab4f8; }
        .main-container {
            flex: 1;
            display: flex;
            overflow: hidden;
        }
        .canvas-container {
            flex: 1;
            position: relative;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        .sidebar {
            width: 280px;
            background: #111118;
            border-left: 1px solid #2a2a3a;
            padding: 12px;
            overflow-y: auto;
            font-size: 11px;
        }
        .sidebar h2 {
            font-size: 12px;
            color: #8ab4f8;
            margin-bottom: 8px;
            border-bottom: 1px solid #2a2a3a;
            padding-bottom: 4px;
        }
        .stat-row {
            display: flex;
            justify-content: space-between;
            padding: 3px 0;
            border-bottom: 1px solid #1a1a2a;
        }
        .stat-label { color: #888; }
        .stat-value { color: #ccc; font-family: monospace; }
        .event-log {
            margin-top: 12px;
            max-height: 300px;
            overflow-y: auto;
        }
        .event-log .event {
            padding: 4px 6px;
            margin-bottom: 3px;
            background: #1a1a2a;
            border-radius: 3px;
            border-left: 3px solid #8ab4f8;
        }
        .event .time { color: #666; font-family: monospace; }
        .event .desc { color: #bbb; }
        .view-tabs {
            display: flex;
            gap: 4px;
            margin-bottom: 8px;
        }
        .legend {
            margin-top: 12px;
        }
        .legend-item {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 2px 0;
        }
        .legend-swatch {
            width: 12px;
            height: 12px;
            border-radius: 2px;
        }
        #spacetimeCanvas {
            border-top: 1px solid #2a2a3a;
        }

        /* --- Mobile Responsive --- */
        .mobile-toggle {
            display: none;
            background: #2a2a3a;
            border: 1px solid #3a3a4a;
            color: #8ab4f8;
            padding: 8px 16px;
            border-radius: 4px;
            font-size: 13px;
            cursor: pointer;
            position: fixed;
            bottom: 12px;
            right: 12px;
            z-index: 100;
            box-shadow: 0 2px 8px rgba(0,0,0,0.5);
        }
        .mobile-toggle:active { background: #4a4a6a; }

        .mobile-stats {
            display: none;
            position: fixed;
            top: 50px;
            left: 8px;
            background: rgba(17,17,24,0.85);
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 10px;
            z-index: 50;
            backdrop-filter: blur(4px);
        }
        .mobile-stats .stat-row {
            border: none;
            padding: 1px 0;
        }

        @media (max-width: 768px) {
            body {
                overflow: hidden;
                touch-action: none;
            }
            header {
                padding: 8px 12px;
                flex-direction: column;
                align-items: flex-start;
                gap: 8px;
                max-height: 60vh;
                overflow-y: auto;
                transition: max-height 0.3s ease;
            }
            header.collapsed {
                max-height: 44px;
                overflow: hidden;
            }
            header.collapsed .controls {
                display: none;
            }
            header h1 {
                font-size: 13px;
                display: flex;
                align-items: center;
                gap: 10px;
                width: 100%;
            }
            header h1::after {
                content: '▼';
                font-size: 10px;
                color: #666;
                margin-left: auto;
            }
            header.collapsed h1::after {
                content: '▶';
            }
            .controls {
                flex-direction: column;
                align-items: stretch;
                gap: 8px;
                width: 100%;
            }
            .control-group {
                gap: 8px;
            }
            .control-group label {
                font-size: 12px;
                min-width: 100px;
            }
            .control-group input[type="range"] {
                width: 100%;
                flex: 1;
                height: 28px;
            }
            .control-group span {
                font-size: 12px;
                min-width: 40px;
                text-align: right;
            }
            button {
                padding: 10px 16px;
                font-size: 13px;
                min-height: 36px;
            }
            .main-container {
                flex-direction: column;
            }
            .sidebar {
                display: none;
            }
            .mobile-toggle {
                display: block;
            }
            .mobile-stats {
                display: block;
            }
            .canvas-container {
                width: 100%;
                height: 100%;
            }
        }

        @media (max-width: 768px) and (orientation: landscape) {
            header.collapsed {
                max-height: 36px;
            }
            .mobile-stats {
                top: 40px;
                font-size: 9px;
            }
        }
    </style>
</head>
<body>
    <header>
        <h1>Relative Light Cone Simulation</h1>
        <div class="controls">
            <div class="control-group">
                <label>Particles:</label>
                <input type="range" id="particleCount" min="3" max="30" value="8">
                <span id="particleCountVal">8</span>
            </div>
            <div class="control-group">
                <label>Speed Limit (c):</label>
                <input type="range" id="speedLimit" min="1" max="10" value="10">
                <span id="speedLimitVal">10</span>
            </div>
            <div class="control-group">
                <label>Brownian σ:</label>
                <input type="range" id="brownian" min="0" max="100" value="15">
                <span id="brownianVal">0.15</span>
            </div>
            <div class="control-group">
                <label>Interaction Radius:</label>
                <input type="range" id="interactionRadius" min="1" max="5" value="2">
                <span id="interactionRadiusVal">2</span>
            </div>
            <div class="control-group">
                <label>Cone Lookahead:</label>
                <input type="range" id="lookahead" min="0" max="5" value="1" step="1">
                <span id="lookaheadVal">1</span>
            </div>
            <div class="control-group">
                <label>Gravity Falloff:</label>
                <input type="range" id="gravityRange" min="10" max="500" value="500">
                <span id="gravityRangeVal">500</span>
            </div>
            <div class="control-group">
                <label>Gravity Strength:</label>
                <input type="range" id="gravityStrength" min="0" max="100" value="50">
                <span id="gravityStrengthVal">0.025</span>
            </div>
            <div class="control-group">
                <button id="btnGravityViz">Show Wells</button>
                <button id="btnShowBoundaries">Show Boundaries</button>
            </div>
            <div class="control-group">
                <button id="btnPlay" class="active">▶ Play</button>
                <button id="btnStep">⏭ Step</button>
                <button id="btnReset">↺ Reset</button>
            </div>
            <div class="control-group">
                <button id="btnViewTop" class="active">2D View</button>
                <button id="btnViewSpacetime">Spacetime</button>
                <button id="btnViewSplit">Split</button>
            </div>
        </div>
    </header>
    <div class="mobile-stats" id="mobileStats">
        <div class="stat-row"><span class="stat-label">t=</span><span class="stat-value" id="mStatTime">0</span> &nbsp;<span class="stat-label">n=</span><span class="stat-value" id="mStatParticles">0</span> &nbsp;<span class="stat-label">merges=</span><span class="stat-value" id="mStatMerges">0</span></div>
    </div>
    <button class="mobile-toggle" id="btnMobileControls">⚙ Controls</button>
    <div class="main-container">
        <div class="canvas-container" id="canvasContainer">
            <canvas id="mainCanvas"></canvas>
            <canvas id="spacetimeCanvas" style="display:none;"></canvas>
        </div>
        <div class="sidebar">
            <h2>Simulation State</h2>
            <div class="stat-row"><span class="stat-label">Time Step:</span><span class="stat-value" id="statTime">0</span></div>
            <div class="stat-row"><span class="stat-label">Active Particles:</span><span class="stat-value" id="statParticles">0</span></div>
            <div class="stat-row"><span class="stat-label">Total Merges:</span><span class="stat-value" id="statMerges">0</span></div>
            <div class="stat-row"><span class="stat-label">Avg Voronoi Area:</span><span class="stat-value" id="statAvgArea">—</span></div>
            <div class="stat-row"><span class="stat-label">Area Std Dev:</span><span class="stat-value" id="statAreaDev">—</span></div>

            <h2 style="margin-top:12px;">Light Cone Analysis</h2>
            <div class="stat-row"><span class="stat-label">Max Cone Expansion:</span><span class="stat-value" id="statMaxExpansion">—</span></div>
            <div class="stat-row"><span class="stat-label">Affected Neighbors:</span><span class="stat-value" id="statAffected">—</span></div>

            <div class="legend" id="legend">
                <h2>Particles</h2>
            </div>

            <div class="event-log">
                <h2>Interaction Log</h2>
                <div id="eventLog"></div>
            </div>
        </div>
    </div>

    <script>
    // ============================================================
    // RELATIVE LIGHT CONE SIMULATION
    // Theory: Interaction-induced branching is relative, not universal.
    // Voronoi cells represent "forward light cones" — the region of
    // space each particle can causally influence at each time step.
    // When particles merge, their combined cone alters ALL other cones.
    // ============================================================

    const mainCanvas = document.getElementById('mainCanvas');
    const spacetimeCanvas = document.getElementById('spacetimeCanvas');
    const ctx = mainCanvas.getContext('2d');
    const stCtx = spacetimeCanvas.getContext('2d');

    // --- State ---
    let particles = [];
    let history = [];       // Array of snapshots: [{particles, voronoiAreas, time}]
    let mergeEvents = [];
    let timeStep = 0;
    let running = true;
    let animId = null;
    let viewMode = 'top'; // 'top', 'spacetime', 'split'
    let showGravityWells = false;
    let showBoundaries = false;

    // --- Parameters ---
    let params = {
        particleCount: 8,
        speedLimit: 10,
        brownianSigma: 0.15,
        interactionRadius: 2,
        lookahead: 1,  // How far ahead (in time steps) to project velocity for cone shape
        gravityRange: 500,    // Falloff distance for gravitational influence
        gravityStrength: 0.025 // Gravitational constant G (range 0–0.05)
    };

    // --- Color palette for particles ---
    const PALETTE = [
        '#ff6b6b', '#feca57', '#48dbfb', '#ff9ff3', '#54a0ff',
        '#5f27cd', '#01a3a4', '#f368e0', '#ee5a24', '#009432',
        '#6c5ce7', '#fd79a8', '#00b894', '#e17055', '#0984e3',
        '#d63031', '#fdcb6e', '#00cec9', '#e84393', '#2d3436',
        '#a29bfe', '#55efc4', '#fab1a0', '#74b9ff', '#b2bec3',
        '#636e72', '#dfe6e9', '#ffeaa7', '#81ecec', '#fd79a8'
    ];

    function hslToRgb(h, s, l) {
        s /= 100; l /= 100;
        const k = n => (n + h / 30) % 12;
        const a = s * Math.min(l, 1 - l);
        const f = n => l - a * Math.max(-1, Math.min(k(n) - 3, Math.min(9 - k(n), 1)));
        return [Math.round(f(0) * 255), Math.round(f(8) * 255), Math.round(f(4) * 255)];
    }

    // --- Particle class ---
    class Particle {
        constructor(x, y, vx, vy, id, color) {
            this.x = x;
            this.y = y;
            this.vx = vx;
            this.vy = vy;
            this.id = id;
            this.color = color;
            this.mass = 1;
            this.alive = true;
            this.trail = [{x, y, t: 0}];
            this.voronoiAreaHistory = [];
            this.mergedFrom = []; // IDs of particles merged into this one
        }

        speed() {
            return Math.sqrt(this.vx * this.vx + this.vy * this.vy);
        }

        applyBrownianMotion(sigma) {
            // Box-Muller transform for Gaussian noise
            // Inertia: heavier particles resist perturbation (sigma / mass)
            const u1 = Math.random();
            const u2 = Math.random();
            const effectiveSigma = sigma / this.mass;
            const mag = effectiveSigma * Math.sqrt(-2 * Math.log(u1 || 0.0001));
            const angle = 2 * Math.PI * u2;
            this.vx += mag * Math.cos(angle);
            this.vy += mag * Math.sin(angle);

            // Enforce speed limit (analogous to c)
            const spd = this.speed();
            if (spd > params.speedLimit) {
                this.vx = (this.vx / spd) * params.speedLimit;
                this.vy = (this.vy / spd) * params.speedLimit;
            }
        }

        step(dt, width, height) {
            this.applyBrownianMotion(params.brownianSigma);
            this.x += this.vx * dt;
            this.y += this.vy * dt;

            // Toroidal wrapping (Asteroids-style)
            if (this.x < 0) this.x += width;
            if (this.x > width) this.x -= width;
            if (this.y < 0) this.y += height;
            if (this.y > height) this.y -= height;

            this.trail.push({x: this.x, y: this.y, t: timeStep});
        }
    }

    // --- Voronoi computation using probability-envelope distance ---
    // Each particle's forward light cone = the set of all positions reachable given:
    //   - Current velocity (deterministic drift)
    //   - Brownian noise (stochastic spread, σ√T in all directions)
    // The envelope is egg-shaped: large forward lobe (drift + diffusion),
    // small rear lobe (diffusion overcoming drift), medium lateral spread.
    //
    // For direction θ relative to velocity, max reach at time horizon T:
    //   forward:  v*T + k*σ*√T
    //   backward: max(k*σ*√T - v*T, min_radius)
    //   perp:     k*σ*√T
    // We use normalized distance (dist / directional_max_reach) for the Voronoi metric.

    function computeVoronoi(particles, width, height) {
        const gridSize = 4;
        const gw = Math.ceil(width / gridSize);
        const gh = Math.ceil(height / gridSize);
        const grid = new Int32Array(gw * gh);
        const areas = new Map();
        const c = params.speedLimit;
        const sigma = params.brownianSigma;

        // Time horizon for envelope computation (how far ahead we project possible paths)
        const T_horizon = 30 + params.lookahead * 10;
        const sqrtT = Math.sqrt(T_horizon);
        const k = 3.0; // confidence factor (3-sigma covers ~99.7% of paths)

        particles.forEach(p => areas.set(p.id, 0));

        // Pre-compute envelope parameters for each particle
        const envelopes = particles.map(p => {
            const spd = p.speed();
            const dirX = spd > 0.01 ? p.vx / spd : 0;
            const dirY = spd > 0.01 ? p.vy / spd : 0;

            // Noise spread (diffusion radius)
            const noiseSpread = k * sigma * sqrtT * 15; // scale for pixel space
            // Drift distance
            const drift = spd * T_horizon * 0.8;

            // Directional max reach:
            const forwardReach = drift + noiseSpread + 20; // min 20px
            const backwardReach = Math.max(noiseSpread - drift * 0.5, 20); // smaller behind
            const perpReach = noiseSpread + drift * 0.2 + 20; // lateral spread

            return {
                x: p.x,
                y: p.y,
                dirX,
                dirY,
                forwardReach,
                backwardReach,
                perpReach,
                // Cosine harmonic coefficients for smooth egg shape
                // r(θ) = c0 + c1*cos(θ) + c2*cos(2θ)
                c0: (forwardReach + backwardReach + 2 * perpReach) / 4,
                c1: (forwardReach - backwardReach) / 2,
                c2: (forwardReach + backwardReach - 2 * perpReach) / 4,
                spd
            };
        });

        // Certainty grid
        const certainty = new Float32Array(gw * gh);

        for (let gy = 0; gy < gh; gy++) {
            for (let gx = 0; gx < gw; gx++) {
                const px = (gx + 0.5) * gridSize;
                const py = (gy + 0.5) * gridSize;
                let minDist = Infinity;
                let secondDist = Infinity;
                let nearest = -1;

                for (let i = 0; i < particles.length; i++) {
                    const env = envelopes[i];
                    const dx = px - env.x;
                    const dy = py - env.y;
                    const rawDist = Math.sqrt(dx * dx + dy * dy) + 0.001;

                    // Compute cos(angle) between velocity direction and direction to point
                    const cosAngle = (dx * env.dirX + dy * env.dirY) / rawDist;

                    // Smooth egg envelope using cosine harmonics (no piecewise seams)
                    // r(θ) = c0 + c1*cos(θ) + c2*cos(2θ), where cos(2θ) = 2cos²(θ)-1
                    const cos2Angle = 2 * cosAngle * cosAngle - 1;
                    const maxReachInDir = Math.max(env.c0 + env.c1 * cosAngle + env.c2 * cos2Angle, 10);

                    // Normalized distance: 0 = at particle, 1 = at envelope edge
                    const normDist = rawDist / maxReachInDir;

                    if (normDist < minDist) {
                        secondDist = minDist;
                        minDist = normDist;
                        nearest = i;
                    } else if (normDist < secondDist) {
                        secondDist = normDist;
                    }
                }

                grid[gy * gw + gx] = nearest;
                // Certainty based on normalized distances
                const dN = minDist;
                const dS = secondDist;
                certainty[gy * gw + gx] = (dS - dN) / (dS + dN + 0.001);

                const id = particles[nearest].id;
                areas.set(id, (areas.get(id) || 0) + gridSize * gridSize);
            }
        }

        return { grid, gw, gh, gridSize, areas, certainty, envelopes };
    }

    // --- Interaction / Merge Logic ---
    // Conservation of momentum: combined velocity = (m1*v1 + m2*v2) / (m1+m2)
    function checkInteractions(particles, radius) {
        const merged = [];
        const dead = new Set();
        const w = mainCanvas.width;
        const h = mainCanvas.height;

        for (let i = 0; i < particles.length; i++) {
            if (dead.has(i)) continue;
            for (let j = i + 1; j < particles.length; j++) {
                if (dead.has(j)) continue;
                // Toroidal shortest distance for interaction check
                const dx = toroidalDelta(particles[i].x - particles[j].x, w);
                const dy = toroidalDelta(particles[i].y - particles[j].y, h);
                const dist = Math.sqrt(dx * dx + dy * dy);

                if (dist < radius) {
                    // Merge j into i (conservation of momentum)
                    const pi = particles[i];
                    const pj = particles[j];
                    const totalMass = pi.mass + pj.mass;

                    // Combined velocity (momentum conservation)
                    pi.vx = (pi.mass * pi.vx + pj.mass * pj.vx) / totalMass;
                    pi.vy = (pi.mass * pi.vy + pj.mass * pj.vy) / totalMass;

                    // Position at center of mass
                    pi.x = (pi.mass * pi.x + pj.mass * pj.x) / totalMass;
                    pi.y = (pi.mass * pi.y + pj.mass * pj.y) / totalMass;

                    pi.mass = totalMass;
                    pi.mergedFrom.push(pj.id, ...pj.mergedFrom);

                    // Enforce speed limit post-merge
                    const spd = pi.speed();
                    if (spd > params.speedLimit) {
                        pi.vx = (pi.vx / spd) * params.speedLimit;
                        pi.vy = (pi.vy / spd) * params.speedLimit;
                    }

                    pj.alive = false;
                    dead.add(j);

                    merged.push({
                        time: timeStep,
                        survivor: pi.id,
                        absorbed: pj.id,
                        position: {x: pi.x, y: pi.y},
                        newVelocity: {vx: pi.vx, vy: pi.vy},
                        newMass: totalMass
                    });
                }
            }
        }

        return merged;
    }

    // --- Initialization ---
    function initParticles(count, width, height) {
        particles = [];
        for (let i = 0; i < count; i++) {
            const margin = 50;
            const x = margin + Math.random() * (width - 2 * margin);
            const y = margin + Math.random() * (height - 2 * margin);
            const angle = Math.random() * 2 * Math.PI;
            const speed = 0.5 + Math.random() * (params.speedLimit * 0.6);
            const vx = speed * Math.cos(angle);
            const vy = speed * Math.sin(angle);
            particles.push(new Particle(x, y, vx, vy, i, PALETTE[i % PALETTE.length]));
        }
        history = [];
        mergeEvents = [];
        timeStep = 0;
        document.getElementById('eventLog').innerHTML = '';
        updateLegend();
    }

    // --- Rendering ---
    function renderTopView(canvas, ctx) {
        const width = canvas.width;
        const height = canvas.height;
        const alive = particles.filter(p => p.alive);

        if (alive.length === 0) return;

        // Compute Voronoi (still needed for area stats)
        const voronoi = computeVoronoi(alive, width, height);

        // Draw overlapping probability envelopes with additive blending
        // Each particle's cone is independent — overlaps show interaction potential
        const imageData = ctx.createImageData(width, height);
        const data = imageData.data;

        // Pre-parse colors
        const colorCache = alive.map(p => {
            const c = document.createElement('canvas').getContext('2d');
            c.fillStyle = p.color;
            c.fillRect(0, 0, 1, 1);
            const d = c.getImageData(0, 0, 1, 1).data;
            return {r: d[0], g: d[1], b: d[2]};
        });

        const gridSize = 4;
        const gw = Math.ceil(width / gridSize);
        const gh = Math.ceil(height / gridSize);

        for (let gy = 0; gy < gh; gy++) {
            for (let gx = 0; gx < gw; gx++) {
                const cellX = (gx + 0.5) * gridSize;
                const cellY = (gy + 0.5) * gridSize;

                // Accumulate contributions from ALL particles
                let totalR = 0, totalG = 0, totalB = 0, totalA = 0;

                for (let i = 0; i < alive.length; i++) {
                    const env = voronoi.envelopes[i];
                    const col = colorCache[i];
                    const dx = cellX - env.x;
                    const dy = cellY - env.y;
                    const rawDist = Math.sqrt(dx * dx + dy * dy) + 0.001;

                    const cosAngle = (dx * env.dirX + dy * env.dirY) / rawDist;
                    const cos2Angle = 2 * cosAngle * cosAngle - 1;
                    const maxReachInDir = Math.max(env.c0 + env.c1 * cosAngle + env.c2 * cos2Angle, 10);

                    const normPos = rawDist / maxReachInDir;
                    if (normPos >= 1.0) continue; // outside this particle's envelope

                    const radialFalloff = 1 - normPos;
                    const intensity = Math.pow(radialFalloff, 1.4) * 0.8;

                    totalR += col.r * intensity;
                    totalG += col.g * intensity;
                    totalB += col.b * intensity;
                    totalA += intensity * 200;
                }

                // Clamp and write pixel data
                const r = Math.min(255, Math.round(totalR));
                const g = Math.min(255, Math.round(totalG));
                const b = Math.min(255, Math.round(totalB));
                const a = Math.min(255, Math.round(totalA));

                for (let py = gy * gridSize; py < Math.min((gy + 1) * gridSize, height); py++) {
                    for (let px = gx * gridSize; px < Math.min((gx + 1) * gridSize, width); px++) {
                        const idx = (py * width + px) * 4;
                        data[idx] = r;
                        data[idx + 1] = g;
                        data[idx + 2] = b;
                        data[idx + 3] = a;
                    }
                }
            }
        }

        // No boundary lines — cones overlap and blend naturally

        ctx.putImageData(imageData, 0, 0);

        // Draw interaction boundaries where envelopes overlap
        if (showBoundaries && alive.length > 1) {
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.4)';
            ctx.lineWidth = 1;
            for (let gy = 0; gy < gh - 1; gy++) {
                for (let gx = 0; gx < gw - 1; gx++) {
                    const cellX = (gx + 0.5) * gridSize;
                    const cellY = (gy + 0.5) * gridSize;

                    // Count how many envelopes cover this cell
                    let coverCount = 0;
                    for (let i = 0; i < alive.length; i++) {
                        const env = voronoi.envelopes[i];
                        const dx = cellX - env.x;
                        const dy = cellY - env.y;
                        const rawDist = Math.sqrt(dx * dx + dy * dy) + 0.001;
                        const cosAngle = (dx * env.dirX + dy * env.dirY) / rawDist;
                        const cos2Angle = 2 * cosAngle * cosAngle - 1;
                        const maxReachInDir = Math.max(env.c0 + env.c1 * cosAngle + env.c2 * cos2Angle, 10);
                        if (rawDist / maxReachInDir < 1.0) coverCount++;
                        if (coverCount >= 2) break;
                    }

                    // Check neighbor to detect boundary transitions
                    const nCellX = (gx + 1.5) * gridSize;
                    const nCellY = (gy + 1.5) * gridSize;
                    let nCountR = 0, nCountD = 0;
                    for (let i = 0; i < alive.length; i++) {
                        const env = voronoi.envelopes[i];
                        // Right neighbor
                        const dxR = nCellX - env.x;
                        const dyR = cellY - env.y;
                        const rawDistR = Math.sqrt(dxR * dxR + dyR * dyR) + 0.001;
                        const cosR = (dxR * env.dirX + dyR * env.dirY) / rawDistR;
                        const cos2R = 2 * cosR * cosR - 1;
                        const maxR = Math.max(env.c0 + env.c1 * cosR + env.c2 * cos2R, 10);
                        if (rawDistR / maxR < 1.0) nCountR++;
                        // Down neighbor
                        const dxD = cellX - env.x;
                        const dyD = nCellY - env.y;
                        const rawDistD = Math.sqrt(dxD * dxD + dyD * dyD) + 0.001;
                        const cosD = (dxD * env.dirX + dyD * env.dirY) / rawDistD;
                        const cos2D = 2 * cosD * cosD - 1;
                        const maxD = Math.max(env.c0 + env.c1 * cosD + env.c2 * cos2D, 10);
                        if (rawDistD / maxD < 1.0) nCountD++;
                    }

                    // Draw edge where overlap count changes (entering/leaving overlap zone)
                    if ((coverCount >= 2) !== (nCountR >= 2) || (coverCount >= 2) !== (nCountD >= 2)) {
                        const px = gx * gridSize;
                        const py = gy * gridSize;
                        ctx.fillStyle = 'rgba(255, 255, 255, 0.5)';
                        ctx.fillRect(px, py, gridSize, gridSize);
                    }
                }
            }
        }

        // Draw particle trails (break on wrap)
        alive.forEach(p => {
            if (p.trail.length > 1) {
                ctx.strokeStyle = p.color + '60';
                ctx.lineWidth = 1;
                const start = Math.max(0, p.trail.length - 60);
                ctx.beginPath();
                ctx.moveTo(p.trail[start].x, p.trail[start].y);
                for (let i = start + 1; i < p.trail.length; i++) {
                    const dx = Math.abs(p.trail[i].x - p.trail[i-1].x);
                    const dy = Math.abs(p.trail[i].y - p.trail[i-1].y);
                    // Break the line if the jump is too large (wrap occurred)
                    if (dx > width * 0.5 || dy > height * 0.5) {
                        ctx.stroke();
                        ctx.beginPath();
                        ctx.moveTo(p.trail[i].x, p.trail[i].y);
                    } else {
                        ctx.lineTo(p.trail[i].x, p.trail[i].y);
                    }
                }
                ctx.stroke();
            }
        });

        // Draw particles
        alive.forEach(p => {
            // Glow
            const gradient = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, 8 + p.mass * 2);
            gradient.addColorStop(0, p.color + 'cc');
            gradient.addColorStop(1, p.color + '00');
            ctx.fillStyle = gradient;
            ctx.beginPath();
            ctx.arc(p.x, p.y, 8 + p.mass * 2, 0, Math.PI * 2);
            ctx.fill();

            // Core
            ctx.fillStyle = p.color;
            ctx.beginPath();
            ctx.arc(p.x, p.y, 3 + p.mass, 0, Math.PI * 2);
            ctx.fill();

            // Velocity arrow
            ctx.strokeStyle = p.color + 'aa';
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            ctx.moveTo(p.x, p.y);
            ctx.lineTo(p.x + p.vx * 5, p.y + p.vy * 5);
            ctx.stroke();

            // Mass label if merged
            if (p.mass > 1) {
                ctx.fillStyle = '#fff';
                ctx.font = '9px monospace';
                ctx.fillText(`m=${p.mass.toFixed(1)}`, p.x + 8, p.y - 8);
            }
        });

        // Draw merge flash effects
        const recentMerges = mergeEvents.filter(e => timeStep - e.time < 20);
        recentMerges.forEach(e => {
            const age = timeStep - e.time;
            const alpha = 1 - age / 20;
            const radius = 10 + age * 3;
            ctx.strokeStyle = `rgba(255, 255, 255, ${alpha * 0.6})`;
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(e.position.x, e.position.y, radius, 0, Math.PI * 2);
            ctx.stroke();
        });

        // Gravity well visualization overlay
        if (showGravityWells) {
            const G = params.gravityStrength * 500;
            const range = params.gravityRange;
            alive.forEach(p => {
                // Alpha scales with G * mass — stronger/heavier = more visible well
                const wellIntensity = Math.min(0.5, G * p.mass * 0.003);

                // Draw radial gradient representing gravity field
                const gradient = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, range);
                gradient.addColorStop(0, `rgba(255, 255, 255, ${wellIntensity})`);
                gradient.addColorStop(0.3, `rgba(200, 200, 255, ${wellIntensity * 0.5})`);
                gradient.addColorStop(0.7, `rgba(150, 150, 255, ${wellIntensity * 0.15})`);
                gradient.addColorStop(1, 'rgba(100, 100, 200, 0)');
                ctx.fillStyle = gradient;
                ctx.beginPath();
                ctx.arc(p.x, p.y, range, 0, Math.PI * 2);
                ctx.fill();

                // Draw falloff radius as a circle outline
                ctx.strokeStyle = `rgba(150, 150, 255, 0.3)`;
                ctx.lineWidth = 1;
                ctx.setLineDash([4, 4]);
                ctx.beginPath();
                ctx.arc(p.x, p.y, range, 0, Math.PI * 2);
                ctx.stroke();
                ctx.setLineDash([]);
            });
        }

        // Store areas for analysis
        alive.forEach(p => {
            const area = voronoi.areas.get(p.id) || 0;
            p.voronoiAreaHistory.push({t: timeStep, area});
        });

        return voronoi.areas;
    }

    function renderSpacetimeView(canvas, ctx) {
        const width = canvas.width;
        const height = canvas.height;

        ctx.fillStyle = '#0a0a0f';
        ctx.fillRect(0, 0, width, height);

        if (history.length < 2) return;

        // Spacetime diagram: X axis = space (projected 1D), Y axis = time (going down)
        const maxTime = history.length;
        const timeScale = height / Math.max(maxTime, 100);

        // Draw grid
        ctx.strokeStyle = '#1a1a2a';
        ctx.lineWidth = 0.5;
        for (let t = 0; t < maxTime; t += 10) {
            const y = t * timeScale;
            ctx.beginPath();
            ctx.moveTo(0, y);
            ctx.lineTo(width, y);
            ctx.stroke();
        }

        // Draw light cone boundaries (45-degree lines from merge events)
        mergeEvents.forEach(e => {
            const t = e.time;
            const x = e.position.x * (width / mainCanvas.width);
            const y = t * timeScale;

            // Forward light cone edges
            ctx.strokeStyle = 'rgba(255, 200, 50, 0.3)';
            ctx.lineWidth = 1;
            ctx.setLineDash([3, 3]);

            // Left cone edge
            ctx.beginPath();
            ctx.moveTo(x, y);
            ctx.lineTo(x - (height - y), height);
            ctx.stroke();

            // Right cone edge
            ctx.beginPath();
            ctx.moveTo(x, y);
            ctx.lineTo(x + (height - y), height);
            ctx.stroke();

            ctx.setLineDash([]);

            // Merge marker
            ctx.fillStyle = 'rgba(255, 200, 50, 0.8)';
            ctx.beginPath();
            ctx.arc(x, y, 4, 0, Math.PI * 2);
            ctx.fill();
        });

        // Draw worldlines from history
        const allParticleIds = new Set();
        history.forEach(snap => {
            snap.particles.forEach(p => allParticleIds.add(p.id));
        });

        allParticleIds.forEach(id => {
            // Find the color for this particle
            const firstAppearance = history.find(s => s.particles.find(p => p.id === id));
            if (!firstAppearance) return;
            const pData = firstAppearance.particles.find(p => p.id === id);
            const color = PALETTE[id % PALETTE.length];

            ctx.strokeStyle = color + 'cc';
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            let started = false;

            for (let t = 0; t < history.length; t++) {
                const snap = history[t];
                const p = snap.particles.find(pp => pp.id === id);
                if (p) {
                    const x = p.x * (width / mainCanvas.width);
                    const y = t * timeScale;
                    if (!started) {
                        ctx.moveTo(x, y);
                        started = true;
                    } else {
                        ctx.lineTo(x, y);
                    }
                }
            }
            ctx.stroke();
        });

        // Voronoi width bands (showing how area changes over time)
        // Draw semi-transparent bands proportional to sqrt(area)
        const alive = particles.filter(p => p.alive);
        alive.forEach(p => {
            if (p.voronoiAreaHistory.length < 2) return;
            ctx.fillStyle = p.color + '15';
            ctx.beginPath();

            const totalArea = mainCanvas.width * mainCanvas.height;

            for (let i = 0; i < p.voronoiAreaHistory.length; i++) {
                const entry = p.voronoiAreaHistory[i];
                const fraction = entry.area / totalArea;
                const bandWidth = fraction * width * 0.8;
                const trailEntry = p.trail[Math.min(i, p.trail.length - 1)];
                const centerX = trailEntry ? trailEntry.x * (width / mainCanvas.width) : width / 2;
                const y = entry.t * timeScale;

                if (i === 0) {
                    ctx.moveTo(centerX - bandWidth / 2, y);
                } else {
                    ctx.lineTo(centerX - bandWidth / 2, y);
                }
            }

            for (let i = p.voronoiAreaHistory.length - 1; i >= 0; i--) {
                const entry = p.voronoiAreaHistory[i];
                const fraction = entry.area / totalArea;
                const bandWidth = fraction * width * 0.8;
                const trailEntry = p.trail[Math.min(i, p.trail.length - 1)];
                const centerX = trailEntry ? trailEntry.x * (width / mainCanvas.width) : width / 2;
                const y = entry.t * timeScale;
                ctx.lineTo(centerX + bandWidth / 2, y);
            }

            ctx.closePath();
            ctx.fill();
        });

        // Labels
        ctx.fillStyle = '#666';
        ctx.font = '10px monospace';
        ctx.fillText('← space →', width / 2 - 30, height - 5);
        ctx.save();
        ctx.translate(12, height / 2);
        ctx.rotate(-Math.PI / 2);
        ctx.fillText('← time →', -20, 0);
        ctx.restore();
    }

    // --- Simulation Step ---
    // Shortest displacement on torus (wrapping boundaries)
    function toroidalDelta(d, size) {
        if (d > size * 0.5) return d - size;
        if (d < -size * 0.5) return d + size;
        return d;
    }

    // --- Gravitational interaction ---
    // F = G * m1 * m2 / r, with exponential falloff beyond gravityRange
    function applyGravity(alive) {
        const G = params.gravityStrength * 500;
        const range = params.gravityRange;
        if (G === 0) return;
        const w = mainCanvas.width;
        const h = mainCanvas.height;

        for (let i = 0; i < alive.length; i++) {
            for (let j = i + 1; j < alive.length; j++) {
                const pi = alive[i];
                const pj = alive[j];
                // Toroidal shortest path
                const dx = toroidalDelta(pj.x - pi.x, w);
                const dy = toroidalDelta(pj.y - pi.y, h);
                const distSq = dx * dx + dy * dy;
                const dist = Math.sqrt(distSq);

                if (dist < 1) continue; // avoid singularity

                // Gravitational force with exponential falloff
                // Using 1/r instead of 1/r^2 for better visibility at pixel scale
                const softening = 20; // prevents extreme forces at close range
                const force = G * pi.mass * pj.mass / (dist + softening) * Math.exp(-dist / range);

                // Unit vector from i to j
                const fx = force * dx / dist;
                const fy = force * dy / dist;

                // Apply acceleration (F/m)
                pi.vx += fx / pi.mass;
                pi.vy += fy / pi.mass;
                pj.vx -= fx / pj.mass;
                pj.vy -= fy / pj.mass;
            }
        }

        // Enforce speed limit after gravity
        alive.forEach(p => {
            const spd = p.speed();
            if (spd > params.speedLimit) {
                p.vx = (p.vx / spd) * params.speedLimit;
                p.vy = (p.vy / spd) * params.speedLimit;
            }
        });
    }

    function simulationStep() {
        const width = mainCanvas.width;
        const height = mainCanvas.height;
        const alive = particles.filter(p => p.alive);

        if (alive.length === 0) return;

        // Apply gravitational attraction between particles
        if (alive.length > 1) applyGravity(alive);

        // Advance particles
        alive.forEach(p => p.step(1, width, height));

        // Check interactions
        const merges = checkInteractions(alive, params.interactionRadius);
        merges.forEach(m => {
            mergeEvents.push(m);
            logEvent(m);
        });

        // Record snapshot for spacetime view
        const aliveNow = particles.filter(p => p.alive);
        history.push({
            particles: aliveNow.map(p => ({id: p.id, x: p.x, y: p.y, vx: p.vx, vy: p.vy})),
            time: timeStep
        });

        timeStep++;
        updateStats(aliveNow);
    }

    // --- UI Updates ---
    function updateStats(alive) {
        document.getElementById('statTime').textContent = timeStep;
        document.getElementById('statParticles').textContent = alive ? alive.length : particles.filter(p => p.alive).length;
        document.getElementById('statMerges').textContent = mergeEvents.length;
        // Mobile stats
        if (document.getElementById('mStatTime')) {
            document.getElementById('mStatTime').textContent = timeStep;
            document.getElementById('mStatParticles').textContent = alive ? alive.length : particles.filter(p => p.alive).length;
            document.getElementById('mStatMerges').textContent = mergeEvents.length;
        }

        if (alive && alive.length > 0) {
            const areas = alive.map(p => {
                const hist = p.voronoiAreaHistory;
                return hist.length > 0 ? hist[hist.length - 1].area : 0;
            });
            const avg = areas.reduce((a, b) => a + b, 0) / areas.length;
            const variance = areas.reduce((a, b) => a + (b - avg) ** 2, 0) / areas.length;
            document.getElementById('statAvgArea').textContent = Math.round(avg).toLocaleString();
            document.getElementById('statAreaDev').textContent = Math.round(Math.sqrt(variance)).toLocaleString();

            // Light cone analysis: track area changes after merges
            if (mergeEvents.length > 0) {
                let maxExpansion = 0;
                let affectedCount = 0;
                alive.forEach(p => {
                    const hist = p.voronoiAreaHistory;
                    if (hist.length > 10) {
                        const recent = hist[hist.length - 1].area;
                        const earlier = hist[Math.max(0, hist.length - 10)].area;
                        const change = (recent - earlier) / (earlier || 1);
                        if (Math.abs(change) > 0.05) affectedCount++;
                        maxExpansion = Math.max(maxExpansion, change);
                    }
                });
                document.getElementById('statMaxExpansion').textContent = (maxExpansion * 100).toFixed(1) + '%';
                document.getElementById('statAffected').textContent = affectedCount + '/' + alive.length;
            }
        }
    }

    function logEvent(merge) {
        const log = document.getElementById('eventLog');
        const div = document.createElement('div');
        div.className = 'event';
        div.innerHTML = `<span class="time">t=${merge.time}</span> <span class="desc">P${merge.absorbed} → P${merge.survivor} (m=${merge.newMass.toFixed(1)})</span>`;
        log.insertBefore(div, log.firstChild);
        if (log.children.length > 50) log.removeChild(log.lastChild);
    }

    function updateLegend() {
        const legend = document.getElementById('legend');
        legend.innerHTML = '<h2>Particles</h2>';
        particles.forEach(p => {
            const item = document.createElement('div');
            item.className = 'legend-item';
            item.innerHTML = `<div class="legend-swatch" style="background:${p.color}"></div>
                <span>P${p.id} ${!p.alive ? '(merged)' : ''}</span>`;
            legend.appendChild(item);
        });
    }

    // --- Resize handling ---
    function resize() {
        const container = document.getElementById('canvasContainer');
        const rect = container.getBoundingClientRect();

        if (viewMode === 'split') {
            mainCanvas.width = rect.width;
            mainCanvas.height = rect.height * 0.55;
            mainCanvas.style.height = '55%';
            spacetimeCanvas.width = rect.width;
            spacetimeCanvas.height = rect.height * 0.45;
            spacetimeCanvas.style.height = '45%';
            spacetimeCanvas.style.display = 'block';
            mainCanvas.style.display = 'block';
        } else if (viewMode === 'spacetime') {
            spacetimeCanvas.width = rect.width;
            spacetimeCanvas.height = rect.height;
            spacetimeCanvas.style.height = '100%';
            spacetimeCanvas.style.display = 'block';
            mainCanvas.style.display = 'none';
        } else {
            mainCanvas.width = rect.width;
            mainCanvas.height = rect.height;
            mainCanvas.style.height = '100%';
            mainCanvas.style.display = 'block';
            spacetimeCanvas.style.display = 'none';
        }
    }

    // --- Main loop ---
    function render() {
        if (viewMode === 'top' || viewMode === 'split') {
            ctx.fillStyle = '#0a0a0f';
            ctx.fillRect(0, 0, mainCanvas.width, mainCanvas.height);
            renderTopView(mainCanvas, ctx);
        }
        if (viewMode === 'spacetime' || viewMode === 'split') {
            renderSpacetimeView(spacetimeCanvas, stCtx);
        }
    }

    function loop() {
        if (running) {
            simulationStep();
        }
        render();
        animId = requestAnimationFrame(loop);
    }

        setTimeout(resize, 350);
    });

    // Prevent pull-to-refresh on mobile
    document.body.addEventListener('touchmove', e => {
        if (e.target.tagName === 'CANVAS') e.preventDefault();
    }, { passive: false });

    resize();
    initParticles(params.particleCount, mainCanvas.width, mainCanvas.height);
    loop();
    </script>
</body>
</html>
